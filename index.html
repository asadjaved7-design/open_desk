<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Open Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Open Desk is a global news and blog platform: every story, every corner, open to all.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700;900&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* Layout concept: classic broadcast-news masthead (utility bar, ticker, wordmark, sticky blue nav) over a
   grid of image-led story cards. Blue carries structure, red is reserved for Breaking/Live only. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --tint:#E8F0FB; --ink:#1A1A1A; --muted:#566176; --line:#D8E0EE;
  --blue:#0B3C8A; --blue-d:#082C66; --link:#0B3C8A; --btn:#0B3C8A; --btn-ink:#FFFFFF;
  --red:#D62828; --focus:#1D6BFF; --shadow:0 10px 30px rgba(11,60,138,.16);
  --serif:'Merriweather',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B111F; --surface:#121A2C; --tint:#16233F; --ink:#E9EEF8; --muted:#A3B0C8; --line:#26334F;
    --link:#8DB8FF; --btn:#2F6FE0; --shadow:0 10px 30px rgba(0,0,0,.5); --focus:#8DB8FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111F; --surface:#121A2C; --tint:#16233F; --ink:#E9EEF8; --muted:#A3B0C8; --line:#26334F;
  --link:#8DB8FF; --btn:#2F6FE0; --shadow:0 10px 30px rgba(0,0,0,.5); --focus:#8DB8FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.6;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
html[lang="ar"] body,html[lang="ur"] body{font-family:'Noto Naskh Arabic',var(--sans);line-height:1.9}
html[lang="hi"] body{font-family:'Noto Sans Devanagari',var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--blue-d)}
body.lock{overflow:hidden}
img,svg{max-width:100%}
a{color:var(--link)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;border:1px solid transparent;border-radius:4px;background:var(--btn);color:var(--btn-ink);font-weight:600;text-decoration:none;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--link);border-color:var(--line)}
.btn.ghost:hover{background:var(--tint);filter:none}
.btn.white{background:#fff;color:var(--blue)}
.btn.sm{min-height:34px;padding:0 14px;font-size:.875rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:50%;padding:0;transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn.line{border-color:var(--line);color:var(--ink)}
.icon-btn.line:hover{background:var(--tint)}
.icon-btn svg{width:18px;height:18px}

/* top bar */
.topbar{background:var(--blue-d);color:#fff;font-size:.8125rem}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px}
.tb-date{opacity:.9;white-space:nowrap}
.tb-ctrl{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
select.lang{height:38px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:19px;padding:0 12px;font:inherit;font-size:.8125rem}
select.lang option{color:#111;background:#fff}

/* ticker */
.ticker{background:var(--surface);border-bottom:1px solid var(--line)}
.ticker .wrap{display:flex;align-items:center;gap:12px;min-height:44px}
.brk{flex:none;background:var(--red);color:#fff;font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:3px;display:inline-flex;align-items:center;gap:6px}
.brk::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.tk-view{flex:1;min-width:0;overflow:hidden;direction:ltr}
.tk-track{display:inline-flex;white-space:nowrap;animation:tick 90s linear infinite;will-change:transform}
.tk-view:hover .tk-track,.tk-track.paused{animation-play-state:paused}
.tk-track a{color:var(--ink);text-decoration:none;font-size:.9rem;font-weight:500;padding-right:44px;position:relative}
.tk-track a::after{content:"";position:absolute;right:20px;top:50%;width:5px;height:5px;background:var(--blue);transform:translateY(-50%) rotate(45deg)}
.tk-track a:hover{text-decoration:underline}
@keyframes tick{to{transform:translateX(-50%)}}
.tk-btn{flex:none;width:30px;height:30px;border:1px solid var(--line);background:transparent;border-radius:50%;color:var(--ink);display:grid;place-items:center;padding:0}
.tk-btn svg{width:12px;height:12px}

/* masthead */
.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:16px;padding-bottom:16px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--link)}
.logo svg{width:46px;height:46px;flex:none}
.logo b{display:block;font:900 clamp(1.7rem,4vw,2.2rem)/1 var(--serif);letter-spacing:-.02em}
.logo small{display:block;font:500 .72rem/1.3 var(--sans);color:var(--muted);margin-top:4px}
.ad{display:grid;place-items:center;text-align:center;gap:2px;border:1px dashed var(--line);background:var(--tint);color:var(--muted);font-size:.78rem;text-decoration:none;padding:8px}
.ad b{font-weight:600;color:var(--ink);font-size:.8rem}
.ad:hover{border-color:var(--btn)}
.ad.banner{width:468px;max-width:100%;height:64px}
.ad.side{aspect-ratio:300/250;width:100%}
.ad.inline{height:130px;margin:34px 0}
@media (max-width:1000px){.mast .ad{display:none}}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--blue);color:#fff}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.nav ul{list-style:none;margin:0;padding:0;display:flex;align-items:stretch}
.nav a.nl,.nav button.nl{display:flex;align-items:center;height:52px;padding:0 14px;color:#fff;text-decoration:none;font-weight:600;font-size:.9375rem;background:none;border:0;border-bottom:3px solid transparent;white-space:nowrap}
.nav a.nl:hover,.nav button.nl:hover{background:rgba(255,255,255,.12)}
.nav a.nl[aria-current="page"]{border-bottom-color:#fff}
.nav .more{position:relative}
.sub{position:absolute;top:100%;inset-inline-start:0;min-width:200px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);display:none;flex-direction:column;padding:6px 0;border-radius:0 0 6px 6px}
.sub.open{display:flex}
.sub a{padding:10px 18px;color:var(--ink);text-decoration:none;font-size:.9rem}
.sub a:hover{background:var(--tint)}
.burger{display:none}
@media (max-width:940px){
  .burger{display:inline-grid;margin-inline-start:auto}
  .nav .wrap{flex-wrap:wrap}
  .nav ul{display:none;flex-direction:column;width:100%;padding-bottom:10px}
  .nav ul.open{display:flex}
  .nav a.nl,.nav button.nl{height:46px;border-bottom:0;border-inline-start:3px solid transparent}
  .nav a.nl[aria-current="page"]{border-inline-start-color:#fff;background:rgba(255,255,255,.1)}
  .nav .more>button{display:none}
  .sub{position:static;display:flex;border:0;box-shadow:none;background:transparent;padding:0}
  .sub a{color:#fff;padding:0 14px;height:46px;display:flex;align-items:center;font-weight:600;font-size:.9375rem;border-inline-start:3px solid transparent}
  .sub a:hover{background:rgba(255,255,255,.12)}
  .nav-title{font-weight:700;font-family:var(--serif)}
}
@media (min-width:941px){.nav-title{display:none}}

/* generic */
main{outline:0;min-height:60vh}
.sec{padding:44px 0}
.sec.tight{padding:28px 0}
.band{background:var(--tint)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-top:3px solid var(--btn);padding-top:12px;margin-bottom:22px}
.sec-h h2{font-size:1.5rem}
.sec-h a{font-weight:600;font-size:.9rem;text-decoration:none;white-space:nowrap}
.sec-h a:hover{text-decoration:underline}
.grid{display:grid;gap:30px 24px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:44px}
@media (max-width:1020px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:28px;align-content:start}
.more-wrap{display:flex;justify-content:center;margin-top:32px}

.cov{display:block;position:relative;overflow:hidden;background:var(--blue);border-radius:4px}
.cov svg{display:block;width:100%;height:100%;transition:transform .5s ease}
a:hover>.cov svg,a:hover .cov svg{transform:scale(1.04)}
.r169{aspect-ratio:16/9}.r43{aspect-ratio:4/3}.sq{aspect-ratio:1/1}
.tag{display:inline-block;font-size:.78rem;font-weight:700;color:var(--link)}
.tag.red{color:#fff;background:var(--red);padding:1px 8px;border-radius:3px}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.8rem;color:var(--muted)}
.card{display:grid;gap:10px;align-content:start;color:inherit;text-decoration:none}
.card h3{font-size:1.1rem}
.card p{color:var(--muted);font-size:.93rem;line-height:1.55}
.card:hover h3,.row:hover h3,.lead:hover h2{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.row{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;align-items:start}
.row h3{font-size:1rem;margin:2px 0 6px}
.row:first-child{border-top:0;padding-top:0}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:36px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.lead{display:grid;gap:14px;color:inherit;text-decoration:none;align-content:start}
.lead h2{font:900 clamp(1.65rem,3.6vw,2.5rem)/1.18 var(--serif)}
.lead p{font-size:1.05rem;color:var(--muted);max-width:60ch}

/* trending */
.trend{list-style:none;margin:0;padding:0}
.trend li{border-top:1px solid var(--line)}
.trend a{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:13px 0;color:inherit;text-decoration:none}
.trend .n{font:900 1.6rem/1 var(--serif);color:var(--link)}
.trend b{display:block;font:700 .95rem/1.35 var(--serif)}
.trend a:hover b{text-decoration:underline}
.trend small{color:var(--muted);font-size:.78rem}
.panel-box{border:1px solid var(--line);background:var(--surface);padding:20px;border-radius:4px}
.panel-box h3{font-size:1.2rem;margin-bottom:6px}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:26px;scrollbar-width:thin}
.tabs button{padding:12px 18px;border:0;background:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--link);border-bottom-color:var(--btn)}

/* opinion */
.op-card{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);padding:22px;border-radius:4px;color:inherit;text-decoration:none;align-content:start}
.op-card:hover h3{text-decoration:underline}
.op-card h3{font-size:1.25rem}
.who{display:flex;align-items:center;gap:12px}
.who b{display:block;font-size:.92rem;line-height:1.3}
.who small{color:var(--muted);font-size:.8rem}
.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--sans)}

/* videos */
.vid{display:grid;gap:10px;color:inherit;text-decoration:none;text-align:start;background:none;border:0;padding:0;width:100%}
.vid .cov{position:relative}
.vid .play{position:absolute;inset:0;display:grid;place-items:center}
.vid .play i{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--blue);box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s}
.vid:hover .play i{transform:scale(1.1)}
.vid .play svg{width:22px;height:22px;margin-inline-start:3px}
.vid .dur{position:absolute;inset-inline-end:10px;bottom:10px;background:rgba(0,0,0,.75);color:#fff;font-size:.75rem;padding:2px 7px;border-radius:3px;font-variant-numeric:tabular-nums}
.vid h3{font-size:1.05rem}
.vid:hover h3{text-decoration:underline}
.vid p{color:var(--muted);font-size:.9rem}
.player{position:relative;border-radius:6px;overflow:hidden;background:#000}
.player .cov{border-radius:0}
.player .big{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.18);border:0;color:#fff}
.player .big i{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--blue)}
.player .big svg{width:28px;height:28px}
.player.playing .big{opacity:0}
.player.playing .big:focus-visible{opacity:1}
.pc{display:flex;align-items:center;gap:12px;margin-top:12px}
.pc input[type=range]{flex:1;accent-color:var(--btn);padding:0;border:0;background:none}
.pc time{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:86px;text-align:end}
.pc .icon-btn{border-color:var(--line);color:var(--ink)}
.pc .icon-btn:hover{background:var(--tint)}

/* carousel */
.car{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.car::-webkit-scrollbar{display:none}
.car .card{flex:0 0 min(80vw,300px);scroll-snap-align:start}
.car-nav{display:flex;gap:8px}

/* newsletter */
.news{background:var(--blue);color:#fff;border-radius:6px;padding:clamp(28px,5vw,52px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.news{grid-template-columns:minmax(0,1fr)}}
.news h2{font:900 clamp(1.4rem,3vw,2rem)/1.2 var(--serif);color:#fff}
.news p{opacity:.9;margin-top:8px}
.nl-form{display:flex;gap:10px;flex-wrap:wrap}
.nl-form input{flex:1 1 220px;min-width:0;height:46px;border:0;border-radius:4px;padding:0 14px;font:inherit;background:#fff;color:#111}
.nl-form .btn{height:46px}
.nl-msg{min-height:1.4em;margin-top:10px;font-size:.9rem}
.news .nl-msg{color:#fff}
.nl-msg.bad{color:#FFD0D0}

/* section pages */
.page-h{background:var(--tint);padding:44px 0 36px;border-bottom:1px solid var(--line)}
.page-h h1{font:900 clamp(1.9rem,4.5vw,2.9rem)/1.1 var(--serif)}
.page-h p{margin-top:10px;color:var(--muted);max-width:64ch}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600}
.chip:hover{background:var(--tint)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
select.sel,.field input,.field select,.field textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);width:100%}
select.sel{width:auto;padding:8px 12px}
.empty{padding:44px 20px;text-align:center;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.srch{display:flex;gap:10px;margin-bottom:22px}
.srch input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:4px;padding:0 14px;font:inherit;background:var(--surface);color:var(--ink)}
.srch .btn{height:48px}

/* article */
.art-cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;padding:36px 0 56px}
@media (max-width:1080px){.art-cols{grid-template-columns:minmax(0,1fr)}}
.art h1{font:900 clamp(1.8rem,4.2vw,2.9rem)/1.15 var(--serif);margin:12px 0}
.art .dek{font-size:1.2rem;color:var(--muted);line-height:1.55;margin-bottom:20px}
.byline{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:14px 0;border-block:1px solid var(--line);margin-bottom:22px}
.byline .meta{font-size:.85rem}
.fig{margin:0 0 28px}
.fig figcaption{font-size:.82rem;color:var(--muted);margin-top:8px}
.share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0}
.share .lbl{font-weight:600;font-size:.88rem;margin-inline-end:4px}
.share a,.share button{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:18px;color:var(--ink);text-decoration:none;font-size:.85rem;font-weight:600}
.share a:hover,.share button:hover{background:var(--tint)}
.takeaways{background:var(--tint);border-inline-start:4px solid var(--btn);padding:18px 22px;border-radius:4px;margin-bottom:28px}
.takeaways h2{font:700 1.05rem var(--serif);margin-bottom:8px}
.takeaways ul{margin:0;padding-inline-start:20px}
.takeaways li{margin:6px 0}
.prose{font-size:1.0625rem;line-height:1.8;max-width:68ch}
.prose p{margin:0 0 1.15em}
.prose h2{font-size:1.45rem;margin:1.9em 0 .6em}
.pq{margin:34px 0;padding:4px 0 4px 22px;border-inline-start:4px solid var(--btn);font:700 clamp(1.25rem,2.6vw,1.6rem)/1.4 var(--serif);color:var(--link)}
.bio{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);padding:20px;border-radius:4px;margin:38px 0;background:var(--surface)}
.bio p{color:var(--muted);font-size:.92rem;margin-top:4px}
.side-sticky{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));display:grid;gap:30px;align-content:start}
.cmt{margin-top:46px}
.cmt h2{font-size:1.4rem;margin-bottom:16px}
.cmt-item{padding:16px 0;border-top:1px solid var(--line)}
.cmt-item b{font-size:.95rem}
.cmt-item small{color:var(--muted);margin-inline-start:10px}
.cmt-item p{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.nextbox{margin-top:40px;border-top:3px solid var(--btn);padding-top:16px}
#prog{position:fixed;inset:env(safe-area-inset-top,0px) 0 auto;height:3px;z-index:95;background:var(--red);width:0}

/* forms and static pages */
.field{display:grid;gap:6px;margin-bottom:16px}
.field label,.field legend{font-weight:600;font-size:.9rem}
.field textarea{min-height:130px;resize:vertical}
.field .hint{color:var(--muted);font-size:.82rem}
.field .err{color:#C21F1F;font-size:.84rem;min-height:1em}
:root[data-theme="dark"] .field .err,:root[data-theme="dark"] .nl-msg.bad{color:#FF9A9A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .field .err{color:#FF9A9A}}

{id:'climate-talks',cat:'world',by:'amira',d:0,motif:'globe',pal:0,regions:['Asia','Europe','Africa','Americas','Middle East','Oceania'],ed:1,
 title:`Global Leaders Gather as Climate Talks Enter Decisive Week`,
 sub:`Negotiators face the hardest questions first: who pays, how fast, and who checks the numbers.`,
 tk:[`The final week of talks is usually where money and timelines are settled.`,`Climate finance and adaptation matter as much as emission targets.`,`Verification rules draw as much debate as headline pledges.`],
 body:[
 `The final week of any major climate negotiation tends to follow the same pattern. The easy language is agreed early. The hard questions are saved for last, when delegations are tired, deadlines are close and every sentence in the draft text carries a price tag.`,
 `This year is no different. Delegations from small island states, large emerging economies and wealthy industrial nations are working through the same short list of issues, and each group arrives with a different definition of what a fair outcome looks like.`,
 {h:`Three questions that decide the outcome`},
 `The first is money. Developing countries argue that cutting emissions and preparing for floods, droughts and storms costs far more than they can fund alone. They want clear, predictable finance from richer countries that have emitted the most over time. Donor governments respond that public budgets are limited and that private investment must fill part of the gap.`,
 `The second is speed. Scientific assessments point to the need for steep cuts within this decade, yet national plans are shaped by domestic politics, energy prices and election calendars. Negotiators spend much of the week deciding how often countries should revisit their targets, and whether weaker plans should draw pressure from others.`,
 {q:`Every pledge is only as strong as the rules for checking it.`},
 `The third is verification. Countries want to know that promises made in a conference hall turn into measurable change at home. Reporting standards, independent review and shared accounting methods sound technical, but they are often where talks stall.`,
 {h:`What to watch for`},
 `Observers look for a few signals. A final text that names specific amounts and dates is usually stronger than one built on broad language. Side agreements between smaller groups of countries, on methane, forests or clean power, can move faster than the full negotiation. And the tone of closing speeches often shows whether delegations feel heard.`,
 `For readers following from far away, the practical takeaway is simple. Headlines will announce either a breakthrough or a failure. The reality is usually somewhere in between, and the real test comes months later, when governments decide whether to turn the agreement into law and into budgets.`
 ]},
{id:'emerging-markets',cat:'business',by:'daniel',d:0,motif:'chart',pal:1,regions:['Asia','Africa','Americas','Middle East'],ed:1,analysis:1,
 title:`How Emerging Markets Are Reshaping the Global Economy`,
 sub:`Younger populations, digital payments and new trade routes are shifting where growth comes from.`,
 tk:[`Many emerging economies have young, growing workforces and fast-rising consumer demand.`,`Mobile payments and digital platforms let businesses scale without traditional infrastructure.`,`Trade between emerging markets is growing, creating routes that bypass old hubs.`],
 body:[
 `For most of the last century, the story of the world economy was told from a handful of capitals. Decisions about prices, supply chains and investment flowed outward from a small group of wealthy countries. That picture is changing, and the change is easiest to see in the places where growth is now being made.`,
 `Emerging markets, a broad label for economies in Asia, Africa, Latin America and the Middle East that are industrialising and urbanising quickly, now account for a large share of global output and an even larger share of new consumers. Their influence shows up in everything from commodity prices to the design of smartphones.`,
 {h:`A young workforce and a growing middle class`},
 `Demographics are a big part of the story. In many emerging economies the median age is far lower than in Europe, Japan or North America. A large working-age population can power manufacturing, services and domestic spending, provided there are enough jobs and enough investment in schools and health care.`,
 `As incomes rise, households move from basic necessities to appliances, education, travel and financial services. Companies of all sizes are redesigning products and prices for these new customers, often starting in markets that were once treated as an afterthought.`,
 {h:`Leapfrogging old infrastructure`},
 `Technology has let some countries skip steps that older economies took decades to complete. Mobile money services allow people without bank accounts to send payments and save. Online marketplaces connect small producers to buyers far beyond their region. Solar power and batteries can bring electricity to communities long before a national grid arrives.`,
 {q:`Growth increasingly begins where the old infrastructure never did.`},
 {h:`New trade routes and new risks`},
 `Trade between emerging economies, sometimes called South-South trade, has grown steadily, and shipping, finance and logistics firms are adjusting. Regional agreements are lowering tariffs, while ports and rail links are being upgraded to move goods faster.`,
 `None of this comes without risk. Many emerging economies carry debt in foreign currencies, which becomes harder to repay when exchange rates move against them. Commodity dependence can make budgets volatile, and rapid urban growth strains housing, water and transport.`,
 {h:`What it means for everyone else`},
 `For businesses and households in wealthier countries, the shift matters in practical ways: where goods are made, which companies compete for customers, and how interest rates and currencies move. The most useful way to read the headlines is to look past any single country and watch the patterns: younger populations, faster adoption of digital tools, and a steady widening of the list of places where the next big company can start.`
 ]},
{id:'ai-daily-life',cat:'technology',by:'mei',d:1,motif:'chip',pal:2,regions:['Asia','Europe','Americas','Africa'],ed:1,
 title:`AI in 2026: Seven Ways It Is Quietly Changing Daily Life`,
 sub:`Most of the change is not dramatic. It is happening inside the small tools people already use.`,
 tk:[`The biggest effects of AI are in everyday tools, not headline-grabbing robots.`,`Translation, accessibility and tutoring help people who were once left out.`,`Accuracy and privacy still need human checks and clear rules.`],
 body:[
 `When people picture artificial intelligence, they often imagine robots or dramatic breakthroughs. In practice, the most noticeable change has been quieter. AI features are being built into phones, browsers, offices and clinics, and many people use them without thinking about it. Here are seven everyday areas where the shift is already visible.`,
 {h:`1. Translation that keeps up`},
 `Real-time translation of text, speech and signs now works well enough for a conversation with a shopkeeper or a quick read of a foreign news site. It is not perfect, and nuance can get lost, but it has made travel, study and cross-border work easier for people who do not share a language.`,
 {h:`2. Better accessibility`},
 `Automatic captions, image descriptions and voice control are opening apps and video to people who are deaf, blind or have limited mobility. For many users these are not conveniences. They are the difference between taking part and being shut out.`,
 {h:`3. Study help on demand`},
 `Students can ask for a concept to be explained another way, practise a language, or check their reasoning at any hour. Used well, this works like a patient tutor. Used badly, it becomes a shortcut that replaces learning.`,
 {h:`4. Faster paperwork`},
 `Hospitals, banks and government offices use AI tools to sort forms, summarise records and answer routine questions. The goal is to give staff more time for the cases that need a person.`,
 {h:`5. Smarter navigation and energy use`},
 `Maps predict traffic and suggest routes, while smart thermostats and power grids use forecasts to cut waste. Small efficiencies add up across millions of homes and journeys.`,
 {h:`6. Tools for small businesses`},
 `A shop owner can now draft product descriptions, answer customer messages in several languages and keep track of orders with software that once needed a dedicated team.`,
 {h:`7. A new need to check what is real`},
 `The same technology that helps can also produce convincing fake images, audio and text. Checking sources, looking for original reporting and being cautious with viral content have become part of everyday media literacy.`,
 {q:`The technology works best as an assistant. The important choices still belong to people.`},
 {h:`The honest limits`},
 `AI systems can be confidently wrong, can reflect biases in their training data, and often depend on large amounts of personal information. Sensible habits help: verify important facts, avoid sharing sensitive details with tools you do not trust, and keep a person in charge of decisions that affect health, money or safety.`
 ]},
{id:'sleep-science',cat:'health',by:'sofia',d:1,motif:'moon',pal:3,regions:['Europe','Americas','Asia','Oceania'],ed:1,
 title:`Sleep Science: Why Millions Are Rethinking Their Nightly Routine`,
 sub:`Researchers keep finding that how we sleep shapes mood, memory and long-term health.`,
 tk:[`Most adults do best with roughly seven to nine hours of sleep.`,`Regular timing, morning light and a calm evening matter as much as total hours.`,`Persistent sleep problems deserve a conversation with a health professional.`],
 body:[
 `Sleep used to be treated as the part of the day you could trade for something more productive. A growing body of research points the other way. Sleep is when the brain sorts memories, the body repairs tissue and the hormones that regulate appetite and mood are rebalanced. Cutting it short has costs that build quietly.`,
 {h:`How much is enough?`},
 `Health agencies generally suggest that most adults need about seven to nine hours a night, though individual needs vary. Teenagers and children need more. What matters is not only the number but whether you wake feeling rested and can stay alert during the day.`,
 {h:`Habits that make a difference`},
 `Sleep specialists tend to give similar advice, and most of it is about rhythm rather than gadgets. Keep a steady schedule: going to bed and waking at similar times, even on weekends, helps the body clock settle. Get daylight in the morning, because bright light early in the day makes it easier to feel sleepy at night. Dim the evening, since lower lights and fewer screens in the hour before bed help the mind wind down.`,
 {q:`Consistency is the cheapest sleep aid there is.`},
 `Watch caffeine and alcohol. Caffeine can linger in the body for many hours, and alcohol may make it easier to fall asleep while making sleep lighter and more broken. Keep the bedroom cool, dark and quiet, and try to reserve the bed for sleep.`,
 {h:`Why so many people are paying attention now`},
 `Wearable devices and sleep-tracking apps have made nightly patterns visible to millions of people for the first time. That can be motivating, but it can also create anxiety. Specialists caution that consumer trackers give estimates, and that worrying about a score can itself disturb sleep.`,
 `Shift work, long commutes, caregiving and late-night work have also pushed many people to rethink how they structure their days. Some employers and schools are experimenting with later start times and flexible schedules.`,
 {h:`When to seek help`},
 `Occasional bad nights are normal. If you regularly struggle to fall asleep, wake often, snore loudly, stop breathing during sleep, or feel exhausted despite spending enough time in bed, speak with a doctor. Conditions such as insomnia and sleep apnoea are common and treatable.`,
 `This article is general information, not medical advice.`
 ]},
{id:'football-rise',cat:'sports',by:'kwame',d:2,motif:'ball',pal:4,regions:['Asia','Africa','Europe','Middle East'],ed:1,
 title:`The Rise of Football in Asia and Africa: A New Global Balance`,
 sub:`Better academies, bigger leagues and a larger World Cup are widening the sport's map.`,
 tk:[`Investment in academies and leagues is producing more world-class players outside Europe and South America.`,`An expanded World Cup format gives Asian and African teams more places.`,`Diaspora talent and global broadcasting keep pulling the sport's centre of gravity outward.`],
 body:[
 `For decades, the football world map had a familiar shape. The sport's biggest honours were shared between Europe and South America, and players from elsewhere often had to leave home to be noticed. That map is being redrawn.`,
 `Across Asia and Africa, new academies, stronger domestic leagues and better coaching are producing players who compete confidently at the highest level. National teams once seen as underdogs now regularly test the established powers, and surprise results have become part of every major tournament.`,
 {h:`Investment from the grassroots up`},
 `Clubs and federations have put money into youth development, from community pitches to full-time academies. Better nutrition, sports science and early exposure to tactical coaching mean that talented teenagers arrive at professional level far better prepared than earlier generations.`,
 `Domestic leagues have also grown in ambition. Higher wages, improved stadiums and wider television coverage help keep good players at home longer and give young fans local heroes to follow.`,
 {h:`A bigger stage`},
 `The expansion of the World Cup to more teams has given national sides from Asia and Africa additional places at the tournament, and with them more chances to build experience against top opponents. Continental competitions have grown in profile as well, drawing larger crowds and broadcast audiences.`,
 {q:`The next great player could come from a town most fans have never heard of.`},
 {h:`Players without borders`},
 `Diaspora talent is another factor. Many players born or raised in Europe choose to represent the countries of their parents or grandparents, bringing top-level training to national teams. At the same time, scouts now work far more widely, and a strong performance in a regional tournament can be watched live by fans and clubs around the world.`,
 {h:`Challenges that remain`},
 `Progress is uneven. Some federations still struggle with funding, governance and travel costs. Pitches and facilities outside major cities can be poor, and young players often depend on a small number of opportunities. Fans and journalists also point to the need for fairer transfer systems, so that the clubs that develop talent share in its value.`,
 `Even so, the direction is clear. Football's centre of gravity is spreading outward, and the sport is richer for it. The next decade is likely to bring more varied styles, more new names and a World Cup picture far less predictable than the one fans grew up with.`
 ]},
{id:'sustainable-cities',cat:'science',by:'priya',d:2,motif:'city',pal:2,regions:['Asia','Europe','Americas','Oceania','Middle East'],ed:1,
 title:`Inside the Race to Build the World's Most Sustainable Cities`,
 sub:`From green roofs to smart grids, planners are testing how cities can grow without overheating the planet.`,
 tk:[`Cities hold most of the world's people and a large share of its emissions, so they also hold many of the solutions.`,`Buildings, transport and energy are the three biggest levers.`,`The most successful projects involve residents, not just engineers.`],
 body:[
 `More than half of the world's people now live in cities, and that share keeps rising. Cities use a great deal of energy, concentrate heat and generate waste, which makes them a large part of the climate problem. They are also where many of the practical answers are being tested first.`,
 {h:`Buildings: the quiet giant`},
 `Heating, cooling and lighting buildings accounts for a big portion of a city's energy use. Better insulation, efficient heat pumps and smarter ventilation can cut that demand sharply. Some cities now require new buildings to meet strict efficiency standards, and offer grants to help owners retrofit older ones.`,
 {h:`Moving people, not just cars`},
 `Transport is the second lever. Cities that make walking, cycling and public transport safe and convenient give residents real alternatives to driving. Electric buses, tram lines and protected bike lanes are common ingredients, but the biggest gains often come from planning: placing homes, jobs and shops close together so that fewer long trips are needed.`,
 {q:`The most sustainable journey is the one a person never needs to make.`},
 {h:`Cooling the city down`},
 `Concrete and asphalt soak up heat, creating urban heat islands that can make a city several degrees warmer than the countryside around it. Planners are answering with street trees, parks, reflective roofs and green walls. Some cities are also redesigning surfaces to behave like sponges, absorbing heavy rain into soil and storage instead of letting it flood the streets.`,
 {h:`Cleaner power, smarter grids`},
 `Rooftop solar, district heating networks and large batteries are changing how electricity is produced and shared. Smart grids use data to balance supply and demand, shifting use to the times when clean power is plentiful.`,
 {h:`The human side`},
 `Technology alone does not make a city sustainable. Projects succeed when residents help shape them, when benefits reach low-income neighbourhoods and when housing stays affordable. A green district that only the wealthy can afford solves little.`,
 `The race is far from over, and no city has all the answers. What is encouraging is how quickly ideas now travel, as planners in one region adapt what worked in another and publish their results for others to test.`
 ]},
{id:'street-food',cat:'culture',by:'lucas',d:3,motif:'bowl',pal:0,regions:['Asia','Americas','Middle East','Africa','Europe'],ed:1,
 title:`Why Street Food Has Become the World's Favorite Travel Story`,
 sub:`Affordable, fast and deeply local, a plate eaten on the pavement often says more about a place than any museum.`,
 tk:[`Street food is affordable, social and rooted in local identity.`,`It supports millions of small vendors, many of them family businesses.`,`A few simple habits make eating on the street safer and more enjoyable.`],
 body:[
 `Ask frequent travellers about their best memory from a trip and the answer is often a meal eaten standing up. Tacos from a late-night cart in Mexico City, grilled suya in a Nigerian evening market, chaat and kebabs in the old lanes of Lahore, noodles ladled out in Bangkok: these are the experiences people describe long after they have forgotten the hotel.`,
 {h:`Food that belongs to a place`},
 `Street food grew up around the needs of working people. It had to be quick, filling and cheap, so cooks built menus around local ingredients and techniques that suited a single burner or a hot griddle. The result is a kind of living archive, with recipes handed down through families and adjusted to the tastes of each neighbourhood.`,
 `It is also social. Eating at a stall usually means sharing a bench or a counter, watching the cook work and chatting with strangers. For visitors, that closeness is often the most direct way to meet a city.`,
 {q:`A plate on the pavement often says more about a place than a museum.`},
 {h:`An economy on wheels`},
 `For millions of people, street vending is a livelihood. Many stalls are small family businesses, and the income supports households and neighbourhoods. Governments and cities have a mixed record in dealing with vendors. Some offer licences, training and designated food zones, while others restrict or remove stalls, which can threaten the people who depend on them.`,
 `Social media has added another layer. A viral video can turn an unknown stall into a destination overnight. That can bring welcome income, but also long queues and rising prices that push out local regulars.`,
 {h:`Eating well on the street`},
 `Most travellers eat street food without trouble, and a few habits help. Choose busy stalls where food turns over quickly, because a crowd usually means freshness. Prefer food that is cooked to order and served hot. Look for clean utensils and covered ingredients, and be careful with raw items if your stomach is not used to the local water. If you have allergies, learn how to explain them in the local language before you order.`,
 {h:`Travelling with respect`},
 `Pay fairly, do not haggle over tiny amounts, and ask before taking photos of people at work. Try the dish the locals are eating rather than the one in the guidebook. The best street food stories usually begin with a simple question: what is the thing you would eat here?`
 ]},
{id:'independent-journalism',cat:'opinion',by:'hannah',d:3,motif:'quote',pal:1,regions:['Europe','Americas','Africa','Asia','Oceania','Middle East'],ed:1,analysis:0,
 title:`Local Voices, Global Stories: Why Independent Journalism Matters`,
 sub:`When reporting comes from the communities it describes, readers everywhere get a clearer picture.`,
 tk:[`Local reporters notice stories that outside media often miss.`,`Independent outlets depend on reader trust and sustainable funding.`,`Readers can strengthen good journalism by how they choose, check and share news.`],
 body:[
 `Every large news story begins somewhere small: a town meeting, a clinic with no medicine, a river that stopped flowing. Someone has to be there to notice, and more often than not that someone is a local reporter who knows the streets, the language and the history behind the facts.`,
 `That is why independent journalism matters, and why its health should concern readers far beyond any single country. When local reporting disappears, the loss is not only local. International coverage depends on it, and so do the officials, businesses and institutions that need someone watching them.`,
 {h:`What local knowledge adds`},
 `A reporter from the community brings context that a visiting correspondent cannot easily acquire. They know which sources are reliable, how a rumour began and what a policy will mean on an ordinary Tuesday. They are also accountable in a way outsiders are not, because the people they write about are their neighbours.`,
 {q:`A newsroom that answers to its readers answers to the truth more often.`},
 {h:`The funding problem`},
 `Independence has a price. Advertising revenue has shifted to a few large platforms, and many small outlets struggle to pay reporters a fair wage. Some turn to reader subscriptions and memberships. Others rely on grants, which can help but need careful rules to protect editorial freedom. In some places, journalists also face legal pressure, harassment or physical danger for doing their jobs.`,
 {h:`What readers can do`},
 `Readers are not powerless. A few habits make a real difference. Read beyond the headline and check who is reporting and how they know what they claim. Compare how different outlets cover the same event. Pay for journalism you value, even a small amount. Share responsibly, because a false story that travels fast can undo days of careful work.`,
 `Open Desk is built on a simple belief: that everyone, wherever they live, deserves access to accurate information and the chance to be heard. Good journalism makes that possible. It deserves our attention, our scrutiny and, when it earns it, our support.`
 ]},
{id:'hidden-destinations',cat:'travel',by:'tomas',d:4,motif:'pin',pal:3,regions:['Europe','Asia','Africa','Americas','Middle East','Oceania'],ed:1,
 title:`10 Underrated Destinations Travelers Are Talking About This Year`,
 sub:`From Alpine lakes to Karakoram valleys, ten places that reward visitors who look beyond the usual list.`,
 tk:[`Lesser-known destinations often offer better value and fewer crowds.`,`Check entry rules, seasons and safety advisories before you book.`,`Staying with local hosts and eating at local places keeps tourism money in the community.`],
 body:[
 `Every year the same handful of cities and beaches fill up with visitors. Meanwhile, plenty of places with striking scenery, welcoming people and rich history stay quiet. Here are ten worth considering, spread across six regions.`,
 {h:`1. Slovenia`},
 `A compact country with a lot packed in: the riverside old town of Ljubljana, the glacial waters of Lake Bled, Alpine hiking and limestone caves, all easy to reach by train or car.`,
 {h:`2. Oman`},
 `Known for hospitality, Oman offers Muscat's coastline, old forts, desert camps and wadis, the seasonal valleys where freshwater pools gather between rocky walls.`,
 {h:`3. Uzbekistan`},
 `The blue-tiled Registan in Samarkand and the old Silk Road cities of Bukhara and Khiva make this one of the great historic journeys, with fast trains linking the main cities.`,
 {h:`4. Georgia`},
 `Tbilisi's old town, hill villages in the Caucasus and one of the world's oldest wine traditions make Georgia a rewarding mix of culture, mountains and food.`,
 {h:`5. The Azores, Portugal`},
 `Green volcanic islands in the middle of the Atlantic, with crater lakes, hot springs and some of the best whale watching in Europe.`,
 {h:`6. Rwanda`},
 `Trekking to see mountain gorillas in Volcanoes National Park is the highlight, and the capital Kigali is known for being clean and welcoming. Book gorilla permits well ahead.`,
 {h:`7. Albania`},
 `A coastline on the Adriatic and Ionian seas, the Ottoman-era hill town of Berat and good value for money draw a growing number of visitors.`,
 {h:`8. Colombia's Coffee Region`},
 `Rolling green hills, working coffee farms and the Cocora Valley, home to some of the tallest palm trees on Earth, make for slow and scenic days.`,
 {h:`9. Hunza Valley, Pakistan`},
 `Set beneath Karakoram peaks along the Karakoram Highway, Hunza is known for the historic Baltit and Altit forts, terraced fields and spring apricot blossom. Check road and weather conditions before you travel.`,
 {h:`10. Tasmania, Australia`},
 `Wild national parks such as Cradle Mountain, a strong food and wine scene and the art museum in Hobart give this island state an appeal far beyond its size.`,
 {h:`Before you go`},
 `Check visa rules, seasonal weather and your government's travel advice for each destination. Where you can, choose local guides and family-run places to stay, so that the benefits of your trip reach the community you are visiting.`
 ]},
{id:'online-learning',cat:'education',by:'aisha',d:4,motif:'book',pal:4,regions:['Asia','Africa','Americas','Europe','Middle East','Oceania'],ed:1,
 title:`Online Learning Goes Global: How Students Everywhere Are Catching Up`,
 sub:`Cheaper data, mobile-first courses and offline tools are opening classrooms to people far from any campus.`,
 tk:[`Mobile phones are now the main classroom for many learners.`,`Offline downloads and low-bandwidth design help students with weak connections.`,`Online study works best when combined with human support and clear goals.`],
 body:[
 `Not long ago, a good education often depended on where you were born. A strong school, a university seat or a skilled teacher might be hours away, or simply out of reach. Online learning has not erased that gap, but it has narrowed it in ways that would have seemed unlikely a decade ago.`,
 {h:`The phone as a classroom`},
 `For many learners, a smartphone is the only computer they own. Course providers and schools have responded with mobile-first lessons, short video segments and text-based material that loads quickly. Students can study on a bus ride, between shifts or in the evening after family duties are done.`,
 `Offline features matter too. Learners can download a lesson while on a strong connection and study it later without using data, which is a lifeline in areas where connectivity is patchy or expensive.`,
 {q:`Access is not the same as learning, but without access nothing else is possible.`},
 {h:`Learning in your own language`},
 `Translation and captioning tools are helping lessons travel across languages. A student in one country can follow a lecture recorded in another, with subtitles and glossaries to help. Local teachers are also publishing their own courses, giving learners material that reflects their culture, exams and curriculum.`,
 {h:`Skills and credentials`},
 `Short courses, certificates and project-based programmes let people gain job-ready skills without years of full-time study. Employers increasingly look at what candidates can demonstrate rather than only where they studied, although recognition still varies between countries and sectors.`,
 {h:`What still holds students back`},
 `Challenges remain. Electricity and internet access are uneven, and many families cannot afford a personal device. Completion rates in self-paced courses are often low, because studying alone is hard. Teachers, mentors and study groups make a large difference, which is why many programmes now add community support or local learning hubs.`,
 {h:`Making it work`},
 `For learners, a few simple choices help: set a regular time, pick one clear goal, find a study partner and use free trial periods before paying. For governments and schools, the priority is to treat online tools as a partner to teachers rather than a replacement, and to invest in the connectivity that makes them usable for everyone.`
 ]},
{id:'voter-information',cat:'politics',by:'omar',d:5,motif:'vote',pal:1,regions:['Asia','Europe','Africa','Americas','Middle East','Oceania'],analysis:1,
 title:`How Voters Around the World Are Getting Their Information`,
 sub:`Television, messaging apps and short video now compete for attention, and each brings its own strengths and risks.`,
 tk:[`People now get political information from many sources at once, not just newspapers and television.`,`Messaging apps and short video spread information quickly, which helps and harms.`,`Checking the source, the date and the original claim is the best defence against misinformation.`],
 body:[
 `Ask a voter today where they learn about politics and the answer will often be a list. A television bulletin at breakfast, a family group chat at lunch, a short video during a commute, perhaps a newsletter in the evening. The mix differs from country to country and from one age group to another, but the trend is the same everywhere: more sources, faster.`,
 {h:`Many channels, different habits`},
 `In some countries television and radio remain the main sources, especially for older and rural audiences. In others, smartphones have become the main gateway, with messaging apps used to share articles, voice notes and images within families and communities. Younger voters in particular often meet news through short video, where a clip of a few seconds can reach millions.`,
 `Local newspapers, community radio and independent websites continue to matter, particularly for local issues such as schools, roads and public services that national outlets rarely cover.`,
 {h:`Speed brings benefits and risks`},
 `Fast, personal channels have clear advantages. They lower the cost of reaching an audience, give citizens a way to ask questions directly and help communities organise. They also make it easier for rumours, edited clips and misleading images to spread before anyone has checked them.`,
 {q:`The first version of a story is rarely the whole story.`},
 {h:`How election bodies and newsrooms are responding`},
 `Electoral commissions in many countries now publish voting information in several formats and languages, and some run dedicated channels to answer common questions. Newsrooms and independent fact-checkers publish corrections and explainers, and some partner with platforms to label disputed claims. Researchers continue to study what works, and the findings are mixed, which is a reason for modest expectations.`,
 {h:`Simple habits that help`},
 `Voters can protect themselves with a few steps that apply to any source. Check who published a claim and whether they name their sources. Look at the date, since old stories often resurface as if they were new. Search for the original statement or document rather than relying on a screenshot. Compare coverage from outlets with different perspectives, and pause before sharing something that provokes a strong emotional reaction.`,
 `Informed participation does not require following every headline. It requires a handful of reliable sources and a willingness to check before passing something on.`
 ]},

{id:'remote-work-cities',cat:'business',by:'daniel',d:2,motif:'city',pal:3,regions:['Europe','Americas','Asia'],brief:1,
 title:`Why Remote Work Keeps Reshaping City Centres`,sub:`Offices, cafes and transport are all adjusting to a more flexible week.`,
 tk:[`Hybrid schedules have changed foot traffic in business districts.`,`Some cities are converting empty offices into homes.`,`Small businesses near offices feel the shift most.`],
 body:[`Many companies now ask staff to come in only a few days a week. That has changed the rhythm of city centres, with busy midweek peaks and quieter Mondays and Fridays. Cafes, restaurants and transport operators have adjusted opening hours and timetables to match.`,`City planners are testing new ideas, from converting underused office blocks into apartments to creating neighbourhood work hubs closer to where people live. The long-term effect on property values and local shops is still being worked out.`]},
{id:'small-exporters',cat:'business',by:'daniel',d:5,motif:'chart',pal:0,regions:['Asia','Africa','Americas'],brief:1,
 title:`Small Exporters Are Going Global Through Online Marketplaces`,sub:`A craft workshop or a spice farm can now find buyers in dozens of countries.`,
 tk:[`Online marketplaces lower the cost of finding foreign customers.`,`Shipping, payments and customs are still the hardest steps.`,`Sellers who tell their story well tend to build repeat buyers.`],
 body:[`Online marketplaces and digital payments let small producers reach customers far beyond their home market. Weavers, tea growers and furniture makers are selling directly abroad, often with only a few employees.`,`The hard parts remain practical ones: reliable shipping, customs paperwork and currency costs. Trade agencies and local cooperatives increasingly offer training to help sellers handle them.`]},
{id:'strong-currency',cat:'business',by:'daniel',d:7,motif:'chart',pal:2,regions:['Americas','Europe','Asia','Middle East'],brief:1,
 title:`What a Strong Currency Means for Everyday Prices`,sub:`Exchange rates reach shopping baskets, holiday budgets and company profits.`,
 tk:[`A stronger currency makes imports cheaper and exports pricier.`,`Travellers gain buying power abroad.`,`Exporters can lose competitiveness.`],
 body:[`When a country's currency gains value, imported goods such as fuel, electronics and some foods often become cheaper for consumers. Holidays abroad also cost less, because each unit of home currency buys more.`,`The other side is that exporters find their products more expensive for foreign buyers, which can squeeze sales and jobs. Central banks watch exchange rates closely for this reason.`]},

{id:'passkeys',cat:'technology',by:'mei',d:3,motif:'chip',pal:4,regions:['Americas','Europe','Asia'],brief:1,
 title:`How Passkeys Are Replacing Passwords`,sub:`A sign-in method that is harder to steal and easier to use.`,
 tk:[`Passkeys use your device and a biometric or PIN instead of a typed password.`,`They resist phishing because there is no secret to hand over.`,`Keep a recovery method in case you lose a device.`],
 body:[`A passkey lets you sign in with a fingerprint, face scan or device PIN. The secret never leaves your device, so a fake website cannot trick you into typing it.`,`Major platforms now support them. If you try one, set up a recovery option and keep a backup sign-in method until you are comfortable.`]},
{id:'battery-recycling',cat:'technology',by:'mei',d:6,motif:'chip',pal:2,regions:['Asia','Europe','Americas'],brief:1,
 title:`Why Battery Recycling Is Becoming a Big Business`,sub:`Old phone and car batteries contain metals worth recovering.`,
 tk:[`Batteries contain valuable metals such as lithium, cobalt and nickel.`,`Recycling reduces the need for new mining.`,`Collection and safe handling are the main hurdles.`],
 body:[`As electric vehicles and portable electronics spread, so does the number of ageing batteries. They contain metals that are costly and environmentally heavy to mine, which makes recovering them attractive.`,`Companies are building plants that shred and chemically process used cells. The biggest challenges are collecting batteries safely and designing them so they are easier to take apart.`]},
{id:'satellite-internet',cat:'technology',by:'mei',d:8,motif:'globe',pal:1,regions:['Africa','Asia','Americas','Oceania'],brief:1,
 title:`Satellite Internet Is Reaching Remote Villages`,sub:`Networks in low orbit are bringing connections where cables never reached.`,
 tk:[`Low-orbit satellites offer faster links than older satellite services.`,`Equipment and monthly costs still limit access.`,`Schools and clinics are among the first users.`],
 body:[`Constellations of satellites in low orbit can beam internet to places with no cables or towers, from mountain villages to remote islands. Speeds and delays are much better than older satellite systems.`,`Cost remains the main barrier for households. Community schemes, where a single connection serves a school or health post, are often the first step.`]},

{id:'womens-football-crowds',cat:'sports',by:'kwame',d:3,motif:'ball',pal:0,regions:['Europe','Americas','Africa','Oceania','Asia'],brief:1,
 title:`Women's Football Is Filling Stadiums Worldwide`,sub:`Bigger crowds and broadcasts are changing how clubs plan.`,
 tk:[`Attendances and television audiences for women's football have grown in many countries.`,`Clubs are investing in academies and facilities.`,`Pay and coverage gaps are narrowing but remain.`],
 body:[`Matches that once played in near-empty grounds now regularly draw large crowds, and broadcasters are scheduling games in prime slots. Clubs and federations are building youth pathways so that girls can train from a young age.`,`Players and supporters say that fair pay, strong coverage and safe facilities are the next priorities.`]},
{id:'cricket-short-formats',cat:'sports',by:'kwame',d:6,motif:'ball',pal:3,regions:['Asia','Oceania','Europe','Africa'],brief:1,
 title:`Why Cricket's Shorter Formats Keep Winning New Fans`,sub:`Three-hour matches suit busy lives and new audiences.`,
 tk:[`Shorter formats fit a single evening.`,`Franchise leagues connect fans with global players.`,`Traditionalists still prize the long game.`],
 body:[`Short-form cricket packs a full contest into about three hours, with big hitting and tight finishes that suit television and stadium evenings alike. Franchise leagues in several countries have drawn new fans, including many who never followed the longer game.`,`Many players and supporters still hold up the multi-day format as the sport's deepest test, and boards are working to keep both alive.`]},
{id:'marathon-pacing',cat:'sports',by:'kwame',d:9,motif:'ball',pal:2,regions:['Africa','Europe','Americas','Asia'],brief:1,
 title:`The Quiet Science of Marathon Pacing`,sub:`Starting slower than feels necessary is the oldest trick in distance running.`,
 tk:[`Even pacing usually beats a fast start.`,`Fuel and hydration plans matter from the first hour.`,`Training in the final weeks should taper, not escalate.`],
 body:[`Coaches repeat the same advice: run the first half of a marathon a little slower than you think you should. Energy stores run low in the final miles, and runners who start too fast often pay for it.`,`Practising your drink and fuel plan in training, and easing off mileage in the last two weeks, help most runners arrive fresh.`]},

{id:'walking-after-meals',cat:'health',by:'sofia',d:3,motif:'moon',pal:2,regions:['Europe','Asia','Americas'],brief:1,
 title:`Walking After Meals: A Small Habit With Real Benefits`,sub:`A short stroll can help digestion and steady blood sugar.`,
 tk:[`Ten to fifteen minutes of gentle walking is enough to start.`,`It can help with digestion and energy.`,`People with medical conditions should follow their doctor's advice.`],
 body:[`Studies suggest that a short walk after eating can help the body manage blood sugar and may ease digestion. It does not need to be brisk: a relaxed ten to fifteen minutes is a good start.`,`This is general information. If you have diabetes or another condition, ask your doctor what is right for you.`]},
{id:'vaccine-updates',cat:'health',by:'sofia',d:6,motif:'moon',pal:0,regions:['Africa','Asia','Europe','Americas','Middle East'],brief:1,
 title:`Why Some Vaccines Need Regular Updates`,sub:`Viruses change, and protection sometimes has to keep up.`,
 tk:[`Some viruses mutate quickly, so vaccines are updated to match.`,`Others, like measles, need few changes.`,`Your health service sets the schedule.`],
 body:[`Influenza viruses change often, so the vaccine is adjusted each year to match the strains expected to spread. Other vaccines, such as those for measles, protect for many years with few changes.`,`Health authorities publish schedules based on the latest evidence. A pharmacist or doctor can tell you which ones apply to you.`]},
{id:'nutrition-labels',cat:'health',by:'sofia',d:8,motif:'bowl',pal:4,regions:['Americas','Europe','Oceania','Asia'],brief:1,
 title:`How to Read a Nutrition Label in Under a Minute`,sub:`Three checks cover most of what you need to know.`,
 tk:[`Check the serving size first.`,`Compare sugar, salt and fibre per 100 grams.`,`The ingredient list is ordered by weight.`],
 body:[`Start with the serving size, because every other number on the label is based on it. Then compare similar products using the per-100-gram column, looking at sugar, salt and fibre.`,`Ingredients are listed from largest to smallest by weight, so the first few items tell you what a product is mostly made of.`]}
];

const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h;};

    `<div class="empty"><h3>No stories found</h3><p>Try a different word or remove the category filter.</p><p style="margin-top:14px" class="chips" style="justify-content:center">${['climate','sleep','football','travel','economy'].map(w=>`<button class="chip" data-act="quick-search" data-q="${w}">${w}</button>`).join('')}</p></div>`}
  </div></section>`;

function runSearch(q,cat,sort){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  let l=ARTICLES.filter(a=>cat==='all'||a.cat===cat);
  if(terms.length){
    l=l.map(a=>{let s=0;for(const w of terms){if(!a.text.includes(w)){s=-1;break;}s+=a.title.toLowerCase().includes(w)?5:0;s+=a.sub.toLowerCase().includes(w)?2:0;s+=1;}return{a,s};}).filter(x=>x.s>=0);
    l=sort==='new'?l.sort((x,y)=>x.a.d-y.a.d):l.sort((x,y)=>y.s-x.s||x.a.d-y.a.d);
    return l.map(x=>x.a);
  }
  return l.sort((x,y)=>x.d-y.d);
}
