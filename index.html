  const h=location.hash.replace(/^#/,'');
  if(!h||h==='home') return {r:'home'};
  if(h.startsWith('article-')) return {r:'article',id:h.slice(8)};
  if(CATS[h]) return {r:'section',cat:h};
  if(STATIC.includes(h)) return {r:h};
  return {r:'404'};
}
function setMeta(title,desc,og){
  document.title=title;
  let m=$('meta[name="description"]'); if(!m){m=document.createElement('meta');m.name='description';document.head.appendChild(m);} m.content=desc;
  [['og:title',title],['og:description',desc],['og:type',og||'website'],['og:site_name','Open Desk']].forEach(([p,v])=>{let e=$(`meta[property="${p}"]`);if(!e){e=document.createElement('meta');e.setAttribute('property',p);document.head.appendChild(e);}e.content=v;});
  let ld=$('#ld'); if(ld) ld.remove();
}
function render(keepScroll){
  const R=route(); let html,title='Open Desk',desc='Open Desk is a global news and blog platform: every story, every corner, open to all.';
  document.body.classList.remove('is-art');
  switch(R.r){
    case 'home':html=viewHome();break;
    case 'section':html=viewSection(R.cat);title=t(R.cat)+' | Open Desk';desc=CATS[R.cat].d;break;
    case 'article':{const a=BY[R.id];if(!a){html=view404();break;}
      html=viewArticle(a);title=a.title+' | Open Desk';desc=a.sub;
      const rd=reads();rd[a.id]=(rd[a.id]||0)+1;store.set('od_reads',rd);
      document.body.classList.add('is-art');break;}
    case 'videos':html=viewVideos();title='Videos | Open Desk';break;
    case 'search':html=viewSearch();title='Search | Open Desk';break;
    case 'about':html=viewAbout();title='About | Open Desk';break;
    case 'contact':html=viewContact();title='Contact | Open Desk';break;
    case 'advertise':html=viewAdvertise();title='Advertise | Open Desk';break;
    case 'privacy':html=viewPrivacy();title='Privacy policy | Open Desk';break;
    case 'terms':html=viewTerms();title='Terms of use | Open Desk';break;
    case 'standards':html=viewStandards();title='Editorial standards | Open Desk';break;
    case 'careers':html=viewCareers();title='Careers | Open Desk';break;
    default:html=view404();
  }
  $('#app').innerHTML=html;
  setMeta(title,desc,R.r==='article'?'article':'website');
  if(R.r==='article'){const a=BY[R.id];if(a){const s=document.createElement('script');s.type='application/ld+json';s.id='ld';
    s.textContent=JSON.stringify({'@context':'https://schema.org','@type':'NewsArticle',headline:a.title,description:a.sub,datePublished:a.date.toISOString(),author:{'@type':'Person',name:AU[a.by].name},publisher:{'@type':'Organization',name:'Open Desk'},articleSection:a.cat});document.head.appendChild(s);}}
  markNav(); closeMenus();
  if(!keepScroll){window.scrollTo(0,0);}
  updateCar(); onScroll();
}
function rerender(){const y=window.scrollY;render(true);window.scrollTo(0,y);}
window.addEventListener('hashchange',()=>{closeModal(true);S.top=6;S.sec=6;S.rs=8;if(route().r!=='search')S.ssort='new';render();const m=$('#app');m.setAttribute('tabindex','-1');m.focus({preventScroll:true});});

/* ---------- theme ---------- */
const effTheme=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
function syncTheme(){const b=$('#themeBtn');if(!b)return;const d=effTheme()==='dark';b.innerHTML=d?I.sun:I.moon;b.setAttribute('aria-pressed',String(d));b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');}
function setTheme(v){document.documentElement.dataset.theme=v;store.set('od_theme',v);syncTheme();}

/* ---------- menus, toasts, modal ---------- */
function closeMenus(){const l=$('#navList'),b=$('#burger'),s=$('#sub'),m=$('#moreBtn');if(l)l.classList.remove('open');if(b)b.setAttribute('aria-expanded','false');if(s)s.classList.remove('open');if(m)m.setAttribute('aria-expanded','false');}
let toastT;function toast(msg){const e=$('#toast');e.textContent=msg;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,3200);}
let lastFocus=null, vTimer=null;
function openModal(html,cls=''){const m=$('#modal');$('#modalBody').innerHTML=html;m.className='modal '+cls;m.hidden=false;document.body.classList.add('lock');lastFocus=document.activeElement;const f=$('#modalBody [autofocus]')||$('#modalBody input,#modalBody button,#modalBody select');if(f)f.focus();}
function closeModal(silent){const m=$('#modal');if(m.hidden)return;stopVideo();m.hidden=true;$('#modalBody').innerHTML='';document.body.classList.remove('lock');if(!silent&&lastFocus&&lastFocus.focus)lastFocus.focus();}
const X=`<button class="x" data-act="close-modal" aria-label="Close">${I.close.replace('<svg','<svg width="18" height="18"')}</button>`;
function copyText(txt,okMsg){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();toast(ok?okMsg:'Press Ctrl+C to copy');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(okMsg),fb);}else fb();
}

/* search overlay */
function openSearch(){
  openModal(`${X}<h2>${esc(t('search'))}</h2><form data-form="search-modal" role="search"><label class="sr-only" for="qm">${esc(t('searchPh'))}</label><div class="srch" style="margin:0"><input id="qm" type="search" autofocus value="${esc(S.q)}" placeholder="${esc(t('searchPh'))}" autocomplete="off"><button class="btn" type="submit">${esc(t('search'))}</button></div></form><ul class="res" id="qRes"></ul>`,'top');
  fillResults(S.q);
}
function fillResults(q){
  const ul=$('#qRes');if(!ul)return;
  const r=q.trim()?runSearch(q,'all','rel').slice(0,6):SORTED.filter(a=>!a.brief).slice(0,5);
  ul.innerHTML=(q.trim()?'':`<li class="meta" style="margin:4px 6px 4px">Latest stories</li>`)+(r.length?r.map(a=>`<li><a href="#article-${a.id}"><span class="cov sq">${cover(a)}</span><span><b>${esc(a.title)}</b><small>${esc(catName(a.cat))}, ${esc(AU[a.by].name)}</small></span></a></li>`).join(''):`<li class="empty">No stories match “${esc(q)}”. Press Enter to open the full search.</li>`);
}
function openSub(){
  openModal(`${X}<h2>${esc(t('subscribe'))} to Open Desk</h2><p class="sub-t">${esc(t('newsH'))}</p>
  <form data-form="subscribe" novalidate>${formField('sbEmail','Email address','email','autocomplete="email" required autofocus')}
  <div class="field"><label for="sbFreq">How often</label><select id="sbFreq"><option>Every morning</option><option>Weekly roundup</option></select></div>
  <fieldset class="field" style="border:0;padding:0;margin:0 0 16px"><legend>Topics</legend><div class="checks">${['world','business','technology','health','sports','culture'].map(c=>`<label><input type="checkbox" name="topics" value="${c}" ${['world','business'].includes(c)?'checked':''}> ${esc(t(c))}</label>`).join('')}</div></fieldset>
  <button class="btn" type="submit">${esc(t('subscribe'))}</button></form>`);
}
function showXml(kind){
  const base=location.href.split('#')[0];
  let xml,name;
  if(kind==='rss'){name='RSS feed';xml=`<?xml version="1.0" encoding="UTF-8"?>\n<rss version="2.0">\n<channel>\n  <title>Open Desk</title>\n  <link>${xesc(base)}</link>\n  <description>Every Story. Every Corner. Open to All.</description>\n`+SORTED.slice(0,20).map(a=>`  <item>\n    <title>${xesc(a.title)}</title>\n    <link>${xesc(base)}#article-${a.id}</link>\n    <description>${xesc(a.sub)}</description>\n    <category>${xesc(a.cat)}</category>\n    <pubDate>${a.date.toUTCString()}</pubDate>\n  </item>`).join('\n')+`\n</channel>\n</rss>`;}
  else{name='XML sitemap';xml=`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`+[['',1],...Object.keys(CATS).map(c=>['#'+c,.8]),...ARTICLES.map(a=>['#article-'+a.id,.6])].map(([p,pr])=>`  <url><loc>${xesc(base)}${p}</loc><priority>${pr}</priority></url>`).join('\n')+`\n</urlset>`;}
  S._xml=xml;
  openModal(`${X}<h2>${name}</h2><p class="sub-t">Generated from the stories on this site. Copy it into a file named ${kind==='rss'?'feed.xml':'sitemap.xml'} on your own domain.</p><pre tabindex="0">${esc(xml)}</pre><button class="btn" data-act="copy-xml">Copy ${name}</button>`,'wide');
}

/* video player */
let VS=null;
function openVideo(id){
  const v=VIDEOS.find(x=>x.id===id);if(!v)return;
  VS={v,pos:0,playing:false,muted:false};
  openModal(`${X}<h2>${esc(v.title)}</h2><div class="player" id="player"><span class="cov r169">${cover(v)}</span><button class="big" data-act="vplay" aria-label="Play video"><i>${I.play}</i></button></div>
  <div class="pc"><button class="icon-btn line" data-act="vplay" id="vBtn" aria-label="Play">${I.play}</button><input type="range" id="vSeek" min="0" max="${v.dur}" value="0" step="1" aria-label="Seek"><time id="vTime">0:00 / ${fmtDur(v.dur)}</time><button class="icon-btn line" data-act="vmute" id="vMute" aria-label="Mute">${I.vol}</button></div>
  <p class="sub-t" style="margin-top:14px">${esc(v.desc)} This is a sample player with no audio. Connect your video host to publish real clips.</p>`,'wide');
}
function vUpdate(){if(!VS)return;const s=$('#vSeek'),tm=$('#vTime');if(!s)return;s.value=VS.pos;tm.textContent=`${fmtDur(VS.pos)} / ${fmtDur(VS.v.dur)}`;const b=$('#vBtn');b.innerHTML=VS.playing?I.pause:I.play;b.setAttribute('aria-label',VS.playing?'Pause':'Play');$('#player').classList.toggle('playing',VS.playing);$('.big').setAttribute('aria-label',VS.playing?'Pause video':'Play video');}
function vToggle(){if(!VS)return;if(VS.playing){VS.playing=false;clearInterval(vTimer);}else{if(VS.pos>=VS.v.dur)VS.pos=0;VS.playing=true;clearInterval(vTimer);vTimer=setInterval(()=>{VS.pos=Math.min(VS.v.dur,VS.pos+.25);if(VS.pos>=VS.v.dur){VS.playing=false;clearInterval(vTimer);}vUpdate();},250);}vUpdate();}
function stopVideo(){clearInterval(vTimer);VS=null;}

/* carousel */
function updateCar(){const c=$('#car');if(!c)return;const p=$('#carPrev'),n=$('#carNext');const rtl=document.dir==='rtl';const max=c.scrollWidth-c.clientWidth-2;const x=Math.abs(c.scrollLeft);p.disabled=x<=2;n.disabled=x>=max;p.style.opacity=p.disabled?.4:1;n.style.opacity=n.disabled?.4:1;}

/* ---------- scroll ---------- */
function onScroll(){
  const y=window.scrollY,tt=$('#toTop');if(tt)tt.hidden=y<700;
  const pg=$('#prog');if(pg){if(document.body.classList.contains('is-art')){const h=document.documentElement.scrollHeight-innerHeight;pg.style.width=(h>0?Math.min(100,y/h*100):0)+'%';}else pg.style.width='0';}
}
window.addEventListener('scroll',onScroll,{passive:true});
document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='car')updateCar();},true);
window.addEventListener('resize',updateCar);

/* ---------- forms ---------- */
const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
function setErr(form,key,msg){const e=$(`[data-err="${key}"]`,form);if(e)e.textContent=msg||'';const i=$('#'+key,form)||$(`[name="${key}"]`,form);if(i){if(msg)i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid');}}
function ok(box,h,p){box.innerHTML=`<div class="okbox" role="status"><h3>${h}</h3><p>${p}</p></div>`;}
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const kind=f.dataset.form;
  if(kind==='newsletter'){
    const inp=$('input[type=email]',f),msg=f.nextElementSibling;
    if(!emailOk(inp.value)){msg.textContent='Enter a valid email address, such as name@example.com.';msg.classList.add('bad');inp.setAttribute('aria-invalid','true');inp.focus();return;}
    inp.removeAttribute('aria-invalid');const l=store.get('od_subs',[]);if(!l.includes(inp.value.trim()))l.push(inp.value.trim());store.set('od_subs',l);
    msg.classList.remove('bad');msg.textContent='You are subscribed. Check your inbox for a welcome note. (Demo: saved on this device only.)';inp.value='';toast('Subscribed to the Open Desk newsletter');return;}
  if(kind==='subscribe'){
    const em=$('#sbEmail',f);if(!emailOk(em.value)){setErr(f,'sbEmail','Enter a valid email address.');em.focus();return;}
    const topics=$$('input[name=topics]:checked',f).map(x=>x.value);const l=store.get('od_subs',[]);if(!l.includes(em.value.trim()))l.push(em.value.trim());store.set('od_subs',l);store.set('od_topics',topics);
    $('#modalBody').innerHTML=`${X}<h2>You're in</h2><p class="sub-t">We will send ${esc($('#sbFreq',f).value.toLowerCase())} to ${esc(em.value.trim())}${topics.length?`, covering ${esc(topics.map(c=>t(c)).join(', '))}`:''}. (Demo: saved on this device only.)</p><button class="btn" data-act="close-modal" autofocus>Done</button>`;
    $('#modalBody button[autofocus]').focus();toast('Subscribed');return;}
  if(kind==='search-modal'){S.q=$('#qm').value.trim();S.scat='all';S.ssort='rel';S.rs=8;closeModal(true);if(location.hash==='#search')render();else location.hash='search';return;}
  if(kind==='search-page'){S.q=$('#sq').value.trim();S.rs=8;rerender();$('#sq').focus();const i=$('#sq');i.setSelectionRange(i.value.length,i.value.length);return;}
  if(kind==='comment'){
    const n=$('#cmName',f),x=$('#cmText',f);let bad=false;
    setErr(f,'name',''); setErr(f,'text','');
    if(!n.value.trim()){setErr(f,'name','Enter your name.');bad=true;}
    if(x.value.trim().length<3){setErr(f,'text','Write at least a few words.');bad=true;}
    if(bad){(n.value.trim()?x:n).focus();return;}
    const key='od_c_'+f.dataset.id,l=store.get(key,[]);l.unshift({n:n.value.trim(),x:x.value.trim(),t:Date.now()});store.set(key,l);
    $('#cmList').innerHTML=cmHtml(l);$('#cmtN').textContent=l.length;x.value='';toast('Comment posted');return;}
  if(kind==='contact'||kind==='advertise'){
    const em=$('input[type=email]',f);let bad=false;
    $$('input[required],textarea[required]',f).forEach(i=>{const k=i.id;setErr(f,k,'');if(!i.value.trim()){setErr(f,k,'This field is required.');bad=true;}else if(i.type==='email'&&!emailOk(i.value)){setErr(f,k,'Enter a valid email address.');bad=true;}});
    if(bad){const first=$('[aria-invalid="true"]',f);if(first)first.focus();return;}
    const key=kind==='contact'?'od_msgs':'od_ads',l=store.get(key,[]);l.push({t:Date.now(),email:em.value.trim()});store.set(key,l);
    ok($('#formBox'),kind==='contact'?'Message received':'Request received',`Thank you. We will reply to ${esc(em.value.trim())} soon. (Demo: saved on this device only.)`);toast('Sent');return;}
  if(kind==='apply'){
    const nm=$('#apName',f),em=$('#apEmail',f);let bad=false;setErr(f,'apName','');setErr(f,'apEmail','');
    if(!nm.value.trim()){setErr(f,'apName','Enter your name.');bad=true;}
    if(!emailOk(em.value)){setErr(f,'apEmail','Enter a valid email address.');bad=true;}
    if(bad){(nm.value.trim()?em:nm).focus();return;}
    $('#modalBody').innerHTML=`${X}<h2>Application received</h2><p class="sub-t">Thanks, ${esc(nm.value.trim())}. We will be in touch at ${esc(em.value.trim())}. (Demo: saved on this device only.)</p><button class="btn" data-act="close-modal" autofocus>Close</button>`;$('#modalBody button[autofocus]').focus();return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='qm')fillResults(e.target.value);
  if(e.target.id==='vSeek'&&VS){VS.pos=+e.target.value;vUpdate();}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='langSel')setLang(e.target.value);
  if(id==='secSort'){S.ssort=e.target.value;S.sec=6;rerender();}
  if(id==='srSort'){S.ssort=e.target.value;rerender();}
});

/* ---------- language ---------- */
function setLang(l){
  S.lang=l;store.set('od_lang',l);
  const d=document.documentElement;d.lang=l;d.dir=(l==='ar'||l==='ur')?'rtl':'ltr';
  buildHeader();buildFooter();rerender();
  if(l!=='en')toast(t('langNote'));
}

/* ---------- click actions ---------- */
const ACT={
 'menu'(){const l=$('#navList'),b=$('#burger'),o=l.classList.toggle('open');b.setAttribute('aria-expanded',String(o));b.innerHTML=o?I.close:I.menu;},
 'more'(){const s=$('#sub'),b=$('#moreBtn'),o=s.classList.toggle('open');b.setAttribute('aria-expanded',String(o));},
 'theme'(){setTheme(effTheme()==='dark'?'light':'dark');},
 'open-search'(){openSearch();},
 'open-sub'(){openSub();},
 'close-modal'(){closeModal();},
 'tk-toggle'(){const tr=$('#tkTrack'),b=$('#tkBtn'),p=tr.classList.toggle('paused');b.innerHTML=p?I.play:I.pause;b.setAttribute('aria-label',p?'Resume headlines':'Pause headlines');},
 'more-top'(){S.top+=6;const y=scrollY;render(true);scrollTo(0,y);},
 'more-sec'(){S.sec+=6;const y=scrollY;render(true);scrollTo(0,y);},
 'more-rs'(){S.rs+=8;const y=scrollY;render(true);scrollTo(0,y);},
 'region'(el){S.region=el.dataset.region;const p=$('#regPanel'),list=SORTED.filter(a=>a.regions.includes(S.region)).slice(0,3);
   $$('.tabs [role=tab]').forEach(b=>{const on=b.dataset.region===S.region;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;});
   p.setAttribute('aria-labelledby','tab-'+S.region.replace(/\s/g,''));p.innerHTML=list.map(a=>card(a)).join('');},
 'car'(el){const c=$('#car');const w=c.clientWidth*.85*(+el.dataset.dir)*(document.dir==='rtl'?-1:1);c.scrollBy({left:w,behavior:'smooth'});setTimeout(updateCar,450);},
 'copy-link'(){copyText(location.href,'Link copied');},
 'play-video'(el){openVideo(el.dataset.id);},
 'vplay'(){vToggle();},
 'vmute'(el){if(!VS)return;VS.muted=!VS.muted;el.innerHTML=VS.muted?I.mute:I.vol;el.setAttribute('aria-label',VS.muted?'Unmute':'Mute');},
 'show-rss'(){showXml('rss');},
 'show-sitemap'(){showXml('sitemap');},
 'copy-xml'(){copyText(S._xml||'','Copied to clipboard');},
 'scat'(el){S.scat=el.dataset.c;S.rs=8;rerender();},
 'quick-search'(el){S.q=el.dataset.q;S.scat='all';rerender();},
 'apply'(el){const j=JOBS.find(x=>x.id===el.dataset.id);openModal(`${X}<h2>Apply: ${esc(j.t)}</h2><p class="sub-t">${esc(j.loc)}</p><form data-form="apply" novalidate>${formField('apName','Full name','text','autocomplete="name" required autofocus')}${formField('apEmail','Email','email','autocomplete="email" required')}<div class="field"><label for="apLink">Portfolio or LinkedIn link</label><input id="apLink" type="url" placeholder="https://"></div><div class="field"><label for="apNote">Why this role?</label><textarea id="apNote"></textarea></div><button class="btn" type="submit">Submit application</button></form>`);},
 'cookie-accept'(){store.set('od_cookie','all');$('#cookie').hidden=true;toast('Preferences saved: all cookies');},
 'cookie-essential'(){store.set('od_cookie','essential');$('#cookie').hidden=true;toast('Preferences saved: essential cookies only');},
 'cookie-open'(){$('#cookie').hidden=false;},
 'to-top'(){scrollTo({top:0,behavior:'smooth'});$('#hdr a')&&$('#hdr a').focus({preventScroll:true});}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&ACT[el.dataset.act]){ACT[el.dataset.act](el,e);return;}
  const a=e.target.closest('a[href^="#"]');
  if(a){ if(!e.target.closest('#modal')||true){ if($('#modal')&&!$('#modal').hidden)closeModal(true);} if(a.getAttribute('href')===location.hash){render();} }
  if(!e.target.closest('.more'))$('#sub')&&$('#sub').classList.remove('open'),$('#moreBtn')&&$('#moreBtn').setAttribute('aria-expanded','false');
});
document.addEventListener('keydown',e=>{
  const m=$('#modal');
  if(e.key==='Escape'){ if(!m.hidden){closeModal();return;} closeMenus(); }
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&m.hidden){e.preventDefault();openSearch();}
  if(e.key==='Tab'&&!m.hidden){const f=$$('button,a[href],input,select,textarea,[tabindex="0"]',$('.dlg',m)).filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  const tab=e.target.closest&&e.target.closest('[role=tab]');
  if(tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='Home'||e.key==='End')){
    const tabs=$$('.tabs [role=tab]');let i=tabs.indexOf(tab);const rtl=document.dir==='rtl';
    if(e.key==='ArrowRight')i+=rtl?-1:1;else if(e.key==='ArrowLeft')i+=rtl?1:-1;else if(e.key==='Home')i=0;else i=tabs.length-1;
    i=(i+tabs.length)%tabs.length;tabs[i].focus();ACT.region(tabs[i]);e.preventDefault();}
});

/* ---------- boot ---------- */
function boot(){
  const th=store.get('od_theme',null);if(th)document.documentElement.dataset.theme=th;
  const l=store.get('od_lang','en');if(T[l]){S.lang=l;document.documentElement.lang=l;document.documentElement.dir=(l==='ar'||l==='ur')?'rtl':'ltr';}
  buildHeader();buildFooter();render();
  if(!store.get('od_cookie',null))$('#cookie').hidden=false;
  matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncTheme);
}
boot();
})();

</script>
